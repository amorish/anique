<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md">
<!-- Background Layer with Blur -->
<div class="absolute inset-0 z-0">
<img alt="" class="w-full h-full object-cover opacity-20 mix-blend-overlay" data-alt="Abstract dark atmospheric background with subtle crimson and deep purple gradient flows, moody modern anime cinematic aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEHrf07c9Om-6HxSi7EO1O5noHSASYYtpGmq1BiEp-w6e8Thn8B6o-q-yLIe7koXWFfP_KViKJ2GSe2LEiCR9kbWwhhEk0ia9WVuaCgxkFt5eRBWQVO1HZJShGzfi5dWd4QPAkwi1v6jQl-taZkXJhuNyYWDq6kVw9TlUflkikq7MCxxpkE6nGWcVyuBgUzCWOg2DswgkxCOGi8PTf9uWdu8S0ZqXWy_LffeHrMRFs0DF5PFuGs7heqf3N24QZbcZEQgDmAocktuU"/>
<div class="absolute inset-0 bg-background/80 backdrop-blur-3xl"></div>
</div>
<!-- Centered Glassmorphism Card -->
<main class="relative z-10 w-full max-w-[420px] px-6">
<div class="bg-surface-container-low/70 backdrop-blur-2xl border border-white/5 rounded-xl p-10 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.8)] flex flex-col gap-8 relative overflow-hidden">
<!-- Subtle gradient glow within card -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header -->
<header class="text-center flex flex-col items-center gap-2 relative z-10">
<h1 class="font-display-lg text-display-lg text-primary-container uppercase tracking-tighter">AniQue</h1>
<h2 class="font-title-sm text-title-sm text-on-surface tracking-wide mt-2">Sign In</h2>
</header>
<!-- Form -->
<form class="flex flex-col gap-5 relative z-10">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-highest/40 border border-outline-variant/30 rounded-lg py-3.5 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-on-surface-variant/40" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-highest/40 border border-outline-variant/30 rounded-lg py-3.5 pl-12 pr-12 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-on-surface-variant/40" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary-fixed hover:text-primary transition-colors duration-200" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm uppercase tracking-widest py-4 rounded-lg mt-4 hover:bg-inverse-primary hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 shadow-[0_0_20px_-5px_rgba(229,9,20,0.5)]" type="button">
                    Sign In
                </button>
</form>
<!-- Footer -->
<div class="text-center mt-2 relative z-10 border-t border-white/5 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need an account? 
                    <a class="text-primary-fixed hover:text-primary font-label-sm text-label-sm ml-1 transition-colors duration-200 uppercase tracking-wide" href="#">Sign up</a>
</p>
</div>
</div>
</main>
</body></html>
