<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-20" data-alt="abstract dark anime style futuristic cityscape at night with subtle neon red glows and deep shadows, blurred cinematic background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2qTr-a7EhxODJTZrq1ZfOkhdOKMvFn3EIy4isF5Ruq_4VcCQ5ONXviTwVdGv3AAgI-sywzBc93moSVn8s7i4jGrq1wQchae2WthVeeFma7zCMCLOZw3c6Y3tLGslV8HnDGy4smxSSI6_l8gUP8_xNB-P8buxZicIva41vLUu3vPPmVUXYcJAP3QRIWMHpyOI1F76LisETz52dGxkabB63veI50t1IHFXk8_Xe7sEi3PESGeJELfoA79lZkGi4tGAAZFyGOfgXN3I"/>

</div>
<div class="glass-card rounded-xl w-full max-w-md p-lg relative z-10">
<div class="text-center mb-margin">
<h1 class="font-headline-md text-headline-md italic font-black text-primary-container tracking-tighter mb-sm">AniQue</h1>
<p class="font-title-sm text-title-sm text-on-surface">Create Account</p>
</div>
<form class="space-y-md">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-secondary-container uppercase">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="input-glass w-full rounded-lg h-12 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container/50 focus:outline-none transition-colors" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-secondary-container uppercase">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="input-glass w-full rounded-lg h-12 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container/50 focus:outline-none transition-colors" placeholder="Enter your email" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-secondary-container uppercase">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-glass w-full rounded-lg h-12 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container/50 focus:outline-none transition-colors" placeholder="Create a password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-secondary-container hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-secondary-container uppercase">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-secondary-container" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-glass w-full rounded-lg h-12 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container/50 focus:outline-none transition-colors" placeholder="Confirm your password" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-secondary-container hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-12 bg-primary-container text-white rounded-lg font-label-sm text-label-sm uppercase tracking-wider hover:bg-inverse-primary transition-colors flex items-center justify-center mt-lg shadow-[0_0_20px_rgba(229,9,20,0.3)] hover:shadow-[0_0_30px_rgba(229,9,20,0.5)]" type="button">
                SIGN UP
            </button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-secondary-container">

</p>
