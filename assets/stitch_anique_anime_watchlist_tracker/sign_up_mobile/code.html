<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Cinematic Blurred Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="dark moody cinematic anime style city street at night blurred background soft neon glow depth of field" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAad0GJRIwezkgdVroIxyhtrBwpwoYybDZjkPb84sml7ItB7XJG3mOqNDOXr8VOcpQvZiXIDNchvVGE1IhxoLw2sstTfHzasahD_vhuYH-1UlcxwQBTuEg2lPmnUFtW3xaQJVHpC2qGGnJTvSN2vbUh7SSPgi8Bv_gUs0SG0xNKgCZUTCaJQoktkczxSL5SFcs4kCwktYpnOmOFWeeogX_feQNqIjFvYUI9emhD4h_k_hSQDF_91kGr5B8CjohZJkloFEQ-UrdM75o');">
<!-- Heavy overlay to ensure form legibility -->
<div class="absolute inset-0 bg-background/90 backdrop-blur-xl"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-6 py-12">
<!-- Glassmorphism Card -->
<div class="bg-surface-container-high/40 backdrop-blur-2xl border border-white/10 rounded-2xl p-8 shadow-[0_0_40px_rgba(0,0,0,0.5)]">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="font-display-lg text-display-lg font-black text-primary-container tracking-tighter drop-shadow-[0_0_15px_rgba(229,9,20,0.4)]">AniQue</h1>
<p class="font-body-md text-body-md text-secondary mt-2">Join the premium viewing gallery</p>
</div>
<!-- Sign Up Form -->
<form class="space-y-6">
<!-- Full Name Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest/50 border border-surface-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder-secondary-fixed-dim/50 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest/50 border border-surface-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder-secondary-fixed-dim/50 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest/50 border border-surface-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder-secondary-fixed-dim/50 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all pr-12" id="password" placeholder="Create a password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="confirmPassword">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest/50 border border-surface-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder-secondary-fixed-dim/50 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all pr-12" id="confirmPassword" placeholder="Repeat your password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-title-sm text-title-sm py-4 rounded-xl shadow-[0_0_20px_rgba(229,9,20,0.3)] hover:shadow-[0_0_30px_rgba(229,9,20,0.5)] hover:-translate-y-0.5 transition-all duration-300" type="submit">
                        Sign Up
                    </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center border-t border-white/5 pt-6">
<p class="font-body-md text-body-md text-secondary">
                    Already have an account? 
                    <a class="text-primary hover:text-primary-container transition-colors font-semibold ml-1" href="#">Sign In</a>
</p>
