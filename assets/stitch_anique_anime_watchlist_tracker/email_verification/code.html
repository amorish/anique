<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-body-md text-body-md">

<!-- Top-level destination intent is linear/transactional (Email Verification), so navigation shell (TopAppBar/BottomNavBar) is suppressed. -->
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md">
<!-- Glassmorphism Card -->
<div class="bg-surface-container-high/40 backdrop-blur-3xl border border-white/10 rounded-xl p-8 shadow-[0_8px_32px_rgba(0,0,0,0.5)] flex flex-col items-center text-center transform transition-all duration-300 hover:scale-[1.02] hover:border-white/20">
<!-- Icon Container -->
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-6 relative">
<div class="absolute inset-0 rounded-full border border-primary-container/50 animate-pulse"></div>
<span class="material-symbols-outlined text-4xl text-primary-container" data-icon="mail" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-on-background mb-4">Verify your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-4">
                We've sent a magical link to your inbox. Please click it to confirm your identity and unlock the full AniQue experience.
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm py-3 px-6 rounded hover:bg-inverse-primary transition-colors duration-200 uppercase tracking-widest shadow-[0_4px_14px_rgba(229,9,20,0.4)] flex items-center justify-center gap-2">
                    I've Verified — Let Me In
                    <span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-outline text-on-surface font-label-sm text-label-sm py-3 px-6 rounded hover:bg-surface-variant/50 transition-colors duration-200 uppercase tracking-widest flex items-center justify-center gap-2">
                    Resend Verification Email
                </button>
</div>
<!-- Footer Note -->
<p class="font-label-sm text-label-sm text-on-surface-variant/60 mt-6 mt-lg">
                Didn't receive it? Check your spam folder.
            </p>
</div>
</main>
